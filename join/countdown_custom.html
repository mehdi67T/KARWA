<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <style>
        /* Basic styling to ensure visibility */
        body { 
            background-color: #111b21 !important; 
            color: #e9edef !important; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            text-align: center;
        }
        .container { 
            background-color: #222e35; 
            padding: 30px; 
            border-radius: 15px; 
            width: 85%;
            max-width: 350px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #00a884;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .timer { font-weight: bold; color: #00a884; font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="50" style="margin-bottom:15px;">
    <div class="spinner"></div>
    <h2 style="font-size: 18px;">جاري معالجة البيانات...</h2>
    <p style="color: #8696a0; font-size: 14px;">يرجى الانتظار ثواني قليلة</p>
    <div class="timer">توجيه تلقائي خلال: <span id="secs">10</span></div>
</div>

<script>
    // Simple, bulletproof timer
    var count = 10;
    var counter = setInterval(function() {
        count--;
        document.getElementById('secs').innerHTML = count;
        if (count <= 0) {
            clearInterval(counter);
            window.location.href = "copage.html";
        }
    }, 1000);
</script>

</body>
</html>
