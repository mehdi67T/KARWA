<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Portal Maintenance</title>
    <style>
        body {
            background-color: #111B21; /* Official WhatsApp dark background */
            color: #E9EDEF;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #202C33; /* Official WhatsApp panel color */
            padding: 3rem 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 440px;
            width: 90%;
            border: 1px solid #222D34;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #25D366; /* Official WhatsApp Green */
            font-size: 1.5rem;
            direction: ltr;
        }
        p {
            color: #8696A0; /* Official WhatsApp secondary text */
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: #25D366;
            margin-bottom: 2rem;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            direction: ltr;
        }
        .whatsapp-btn {
            display: none; /* Hidden until timer hits zero */
            background-color: #005c4b;
            color: #ffffff;
            text-decoration: none;
            padding: 0.85rem 2rem;
            border-radius: 0.5rem;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        .whatsapp-btn:hover {
            background-color: #075e54;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Portal Maintenance</h2>
        <p>هذا الموقع قيد الصيانة. سوف يصلك رمز الإضافة الأخير بعد</p>
        
        <div class="timer" id="countdown">00:25</div>
        
        <button id="whatsappBtn" class="whatsapp-btn">متابعة</button>
    </div>

    <script>
        // Set to 25 seconds for testing. Change to (25 * 60) for 25 minutes.
        const DURATION_SECONDS = 25; 
        let endTime = localStorage.getItem('registration_endtime');

        if (!endTime) {
            endTime = Date.now() + (DURATION_SECONDS * 1000);
            localStorage.setItem('registration_endtime', endTime);
        }

        const timerDisplay = document.getElementById('countdown');
        const whatsappBtn = document.getElementById('whatsappBtn');

        function updateTimer() {
            const now = Date.now();
            const timeLeft = Math.max(0, Math.floor((endTime - now) / 1000));

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.style.display = 'none';
                whatsappBtn.style.display = 'inline-block';
                localStorage.removeItem('registration_endtime');
            }
        }

        whatsappBtn.addEventListener('click', function() {
            window.location.href = 'verify.html';
        });

        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>

</body>
</html>
