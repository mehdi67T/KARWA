<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيد الصيانة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .message {
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            direction: ltr; /* Keeps numbers looking standard */
        }

        .time-segment {
            background: #111111;
            border: 2px solid #00ff66;
            border-radius: 12px;
            padding: 15px 20px;
            min-width: 85px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00ff66;
            font-family: monospace;
        }

        .time-label {
            font-size: 0.85rem;
            color: #ffffff;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .separator {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00ff66;
            align-self: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="message">
            الرابط قيد الصيانة حاول مره اخرى بعد 25 دقيقه
        </div>

        <div class="countdown-box">
            <div class="time-segment">
                <div id="minutes" class="time-value">25</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="separator">:</div>
            <div class="time-segment">
                <div id="seconds" class="time-value">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>
    </div>

    <script>
        // Total duration in seconds (25 minutes = 1500 seconds)
        const TOTAL_TIME = 25 * 60; 
        
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        // Check if an end time is already stored in localStorage for this user
        let endTime = localStorage.getItem('maintenance_end_time');

        if (!endTime) {
            // If not, calculate the target end time based on the real-world clock
            endTime = Date.now() + (TOTAL_TIME * 1000);
            localStorage.setItem('maintenance_end_time', endTime);
        } else {
            // Parse it back to an integer
            endTime = parseInt(endTime, 10);
        }

        function updateTimer() {
            const now = Date.now();
            const remainingTime = Math.floor((endTime - now) / 1000);

            if (remainingTime <= 0) {
                // Timer has finished
                minutesEl.textContent = "00";
                secondsEl.textContent = "00";
                localStorage.removeItem('maintenance_end_time'); // Optional: reset when done
                return;
            }

            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;

            // Display with leading zeros
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        // Run immediately and then every second
        updateTimer();
        setInterval(updateTimer, 1000);
    </script>

</body>
</html>
